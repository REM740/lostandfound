<!DOCTYPE html>
<html>
<head>
<title>Manager Login</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="min-h-screen bg-cover bg-center bg-fixed bg-no-repeat flex items-center justify-center" style="background-image: url('{{ MEDIA_URL }}background/background.png');">

<div class="bg-white p-8 rounded-xl shadow-xl w-96 border-4 border-green-700">

<h2 class="text-2xl font-bold mb-4 text-center">Manager Login</h2>

{% if error %}
<p class="text-red-500 mb-4">{{ error }}</p>
{% endif %}

<form method="POST">
{% csrf_token %}

<input type="text" name="username" placeholder="Username"
class="w-full border p-2 mb-3">

<input type="password" name="password" placeholder="Password"
class="w-full border p-2 mb-4">

<button class="bg-green-700 hover:bg-green-800 text-white w-full p-2 rounded">
Login
</button>

</form>

</div>

</body>
</html>
